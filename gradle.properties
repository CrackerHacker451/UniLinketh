# Project-wide Gradle settings.
# JVM arguments: disable memory mapping for ZIPs and use simple canon caches
# This is the primary fix for "user-mapped section open" on Windows
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dsun.zip.disableMemoryMapping=true -Dsun.io.useCanonCaches=false

# Disable VFS watching (locks files on Windows)
org.gradle.vfs.watch=false

# Disable configuration cache to ensure fresh task execution
org.gradle.configuration-cache=false

# Disable the daemon to ensure no background process keeps files open
org.gradle.daemon=false

# Limit parallel workers to 1 to avoid race conditions on file handles
org.gradle.parallel=false
org.gradle.workers.max=1

# Kotlin specific anti-lock settings
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false

# AGP settings
android.nonTransitiveRClass=true
